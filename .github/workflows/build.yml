name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build OmniScan.Net.slnx -c Release
      - run: dotnet test tests/OmniScan.Net.Tests -c Release --no-build
